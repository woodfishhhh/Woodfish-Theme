<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Woodfish Theme</title>
  <desc id="desc">A dark VS Code theme with gradient syntax, configurable glow, and a rainbow cursor.</desc>

  <defs>
    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69C3FF"/>
      <stop offset="0.34" stop-color="#22ECDB"/>
      <stop offset="0.68" stop-color="#B78AFF"/>
      <stop offset="1" stop-color="#F38CEC"/>
    </linearGradient>
    <linearGradient id="cursor-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF2D95"/>
      <stop offset="0.16" stop-color="#FF4500"/>
      <stop offset="0.32" stop-color="#FFD700"/>
      <stop offset="0.48" stop-color="#7CFC00"/>
      <stop offset="0.64" stop-color="#00FFFF"/>
      <stop offset="0.8" stop-color="#1E90FF"/>
      <stop offset="1" stop-color="#B78AFF"/>
    </linearGradient>
    <filter id="cursor-glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="code-clip">
      <rect x="704" y="70" width="424" height="264" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#11161F"/>
  <path d="M0 334H1200" stroke="#253043"/>
  <path d="M664 38V334" stroke="#253043"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="78" fill="#8196B5" font-size="20" font-weight="600" letter-spacing="2">VS CODE THEME + RUNTIME EFFECTS</text>
    <text x="64" y="162" fill="url(#title-gradient)" font-size="72" font-weight="760">Woodfish Theme</text>
    <text x="64" y="216" fill="#D0D7E4" font-size="27" font-weight="560">让代码在深色界面里拥有清晰的色彩层次</text>
    <text x="64" y="260" fill="#8196B5" font-size="22">渐变语法 · 可调发光 · 彩虹光标</text>

    <g transform="translate(64 294)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <rect width="144" height="34" rx="7" fill="#1C2433" stroke="#405275"/>
      <circle cx="20" cy="17" r="5" fill="#3CEC85"/>
      <text x="34" y="23" fill="#D0D7E4">Woodfish on</text>

      <rect x="158" width="42" height="34" rx="7" fill="#1C2433" stroke="#405275"/>
      <text x="172" y="23" fill="#69C3FF">A</text>
      <rect x="210" width="42" height="34" rx="7" fill="#1C2433" stroke="#405275"/>
      <text x="224" y="23" fill="#EACD61">G</text>
      <rect x="262" width="42" height="34" rx="7" fill="#1C2433" stroke="#405275"/>
      <text x="276" y="23" fill="#F38CEC">C</text>
    </g>
  </g>

  <g id="code-specimen" clip-path="url(#code-clip)">
    <rect x="704" y="70" width="424" height="264" rx="12" fill="#181F2C" stroke="#405275"/>
    <rect x="704" y="70" width="424" height="42" fill="#1C2433"/>
    <circle cx="728" cy="91" r="5" fill="#E35535"/>
    <circle cx="747" cy="91" r="5" fill="#EACD61"/>
    <circle cx="766" cy="91" r="5" fill="#3CEC85"/>
    <text x="790" y="98" fill="#8196B5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">settings.json</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="730" y="149" fill="#8196B5">{</text>
      <text x="752" y="184" fill="#69C3FF">"syntaxGradient"</text>
      <text x="948" y="184" fill="#D0D7E4">:</text>
      <text x="968" y="184" fill="#3CEC85">true</text>
      <text x="1014" y="184" fill="#8196B5">,</text>

      <text x="752" y="219" fill="#69C3FF">"glow"</text>
      <text x="848" y="219" fill="#D0D7E4">:</text>
      <text x="868" y="219" fill="#EACD61">0.8</text>
      <text x="906" y="219" fill="#8196B5">,</text>

      <text x="752" y="254" fill="#69C3FF">"cursor"</text>
      <text x="860" y="254" fill="#D0D7E4">:</text>
      <text x="880" y="254" fill="#F38CEC">"rainbow"</text>
      <text x="990" y="254" fill="#8196B5">,</text>
      <text x="730" y="289" fill="#8196B5">}</text>
    </g>

    <rect x="1091" y="133" width="8" height="154" rx="4" fill="#FF2D95" opacity="0.55" filter="url(#cursor-glow)"/>
    <rect x="1093" y="133" width="4" height="154" rx="2" fill="url(#cursor-gradient)"/>
  </g>

  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="64" y="370" fill="#8196B5">WOODFISH DARK</text>
    <text x="292" y="370" fill="#8196B5">VS CODE ^1.74.0</text>
    <text x="1095" y="370" fill="#D0D7E4" text-anchor="end">MIT LICENSE</text>
  </g>
</svg>
