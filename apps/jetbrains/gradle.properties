# Gradle 构建 JVM 参数：插件构建需要较大堆内存
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# 构建性能：并行 + 缓存
org.gradle.parallel=true
org.gradle.caching=true

# 插件元信息
pluginGroup=com.github.yyyyolo7a79
pluginName=Woodfish Theme
pluginVersion=8.2.1

# 编译目标平台。
#
# 刻意选 2024.3 而不是更新的版本编译：它最接近最低支持版本 2024.2（242），
# 用旧平台编译能在编译期就挡住 2025.x 才有的新 API，保证 JBR 21 系列全部可用。
#
# 想用本机已安装的 IDE 编译（省掉数 GB 的分发包下载），把路径写进同目录下的
# gradle.local.properties —— 该文件不入库：
#
#   platformLocalPath=D:/path/to/IntelliJIdea2024.3
#   ide252LocalPath=D:/path/to/IntelliJIdea2025.2
#   ide262LocalPath=D:/path/to/IntelliJIdea2026.2
#
# 文件不存在、或里面的路径不指向真实目录时，按 platformVersion 从 JetBrains 仓库下载。
platformVersion=2024.3.7
