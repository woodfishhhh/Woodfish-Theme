[app]
overall = { fg = "#F8F8F2", bg = "#282A36" }

[mgr]
cwd = { fg = "#FF79C6" }
border_style = { fg = "#191A21" }
find_keyword = { fg = "#FFB86C" }
marker_copied = { fg = "#50FA7B", bg = "#50FA7B" }
marker_cut = { fg = "#FF5555", bg = "#FF5555" }
marker_selected = { fg = "#FF79C6", bg = "#FF79C6" }

[tabs]
active = { fg = "#282A36", bg = "#FF79C6" }
inactive = { fg = "#BABBBA", bg = "#21222C" }

[indicator]
current = { fg = "#F8F8F2", bg = "#44475a" }

[mode]
normal_main = { fg = "#282A36", bg = "#FF79C6" }
normal_alt = { fg = "#FF79C6", bg = "#21222C" }

[filetype]
rules = [
  { url = "*", is = "orphan", fg = "#FF5555" },
  { url = "*", is = "exec", fg = "#50FA7B" },
  { url = "*/", fg = "#BD93F9" },
]
