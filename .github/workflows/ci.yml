name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile all workspaces
        run: pnpm compile

      - name: Check generated themes and renderer scripts
        run: |
          pnpm themes:check
          pnpm runtime:check
          pnpm codex:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test all workspaces
        run: pnpm test --runInBand

      - name: Run VS Code integration tests
        run: xvfb-run -a pnpm test:integration

      - name: Check release package hygiene
        run: pnpm pre-publish

      - name: Package VS Code extension
        run: pnpm package --out "$GITHUB_WORKSPACE/dist/"

      - name: Check the VSIX is self-contained
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          unzip -q dist/*.vsix -d "$SANDBOX"
          cd "$SANDBOX/extension"
          test -f out/extension.js && test -f out/uninstall.js && test -f readme.md
          test ! -d node_modules
          # Workspace packages must be bundled, never required at runtime.
          if grep -l "@woodfish/" out/*.js themes/shared/*.js; then
            echo "VSIX still references a workspace package" >&2
            exit 1
          fi

  desktop-windows:
    # The Codex adapter targets the Windows Store app; PowerShell scripts are parsed here.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test the desktop CLI and shared packages
        run: |
          pnpm --filter @woodfish/theme-core run compile
          pnpm --filter @woodfish/renderer-runtime run compile
          pnpm --filter @woodfish/adapter-codex run compile
          pnpm --filter @woodfish/desktop-cli run compile
          pnpm codex:check
          pnpm --filter @woodfish/adapter-codex run test --runInBand
          pnpm --filter @woodfish/desktop-cli run test --runInBand

      - name: Smoke-test the bundled CLI
        run: node apps/desktop-cli/out/woodfish.js help
