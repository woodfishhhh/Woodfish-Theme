name: Terminal palettes
# Item #119 signoff verification on the merged branch.

on:
  push:
    paths: ['apps/terminal/**', 'packages/theme-core/**']
  pull_request:
    paths: ['apps/terminal/**', 'packages/theme-core/**']

permissions:
  contents: read

jobs:
  terminal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm terminal:check
